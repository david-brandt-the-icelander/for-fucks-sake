name: release

# Publishes the single-player web build to GitHub Pages
# (https://david-brandt-the-icelander.github.io/for-fucks-sake/).
# Runs on a version tag, or by hand from the Actions tab: blank publishes the newest v* tag,
# or name an older tag to roll back to it.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (blank = newest v* tag; an older one rolls back)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick the version to publish
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="$INPUT_TAG"
            if [ -z "$tag" ]; then tag="$(git tag --list 'v*' --sort=-v:refname | head -n1)"; fi
            if ! [[ "$tag" =~ ^v[0-9A-Za-z.+-]+$ ]] || ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::no such release tag: '$tag'"; exit 1
            fi
            git checkout --detach "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Engine tests and replays must pass before publishing
        run: cargo test
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: make wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          FFS_VERSION: ${{ steps.version.outputs.tag }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

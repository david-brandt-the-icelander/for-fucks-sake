name: release

# Deploys the web game to https://forfuckssake.today (wrangler.jsonc, Documentation/mvp/delivery.md).
# Runs on a v* tag push, or by hand from the Actions tab: leave the tag blank to redeploy the newest
# v* tag, or name an older tag to roll back to it.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit on the account; Workers Routes
# and DNS: Edit on the forfuckssake.today zone).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (blank = newest v* tag; an older one rolls back)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://forfuckssake.today
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick the version to deploy
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="$INPUT_TAG"
            if [ -z "$tag" ]; then tag="$(git tag --list 'v*' --sort=-v:refname | head -n1)"; fi
            if ! [[ "$tag" =~ ^v[0-9A-Za-z.+-]+$ ]] || ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::no such release tag: '$tag'"; exit 1
            fi
            # the tag's game, deployed with this run's Worker config (wrangler.jsonc, worker/)
            git checkout "$tag" -- crates content web Cargo.toml Cargo.lock Makefile
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Deploying $tag"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Engine tests and replays must pass before deploying
        run: cargo test
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: make wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          FFS_VERSION: ${{ steps.version.outputs.tag }}
      - name: Deploy to forfuckssake.today
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::repository secret CLOUDFLARE_API_TOKEN is not set"; exit 1; fi
          npx --yes wrangler@4.156.0 deploy

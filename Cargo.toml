[workspace]
resolver = "2"
members = ["crates/ffs-content", "crates/ffs-core", "crates/ffs-cli", "crates/ffs-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
blake3 = { version = "1", features = ["pure"] }
rand_chacha = "0.9"
rand_core = "0.9"
ts-rs = "11"

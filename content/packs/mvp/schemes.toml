# Schemes: a ladder. Each run shuffles the schemes within each tier, then orders the tiers
# 1, 2, 3... Three are on offer at a time (the tier-1 ones at the start). Each scheme can be run
# once per run; the one you take is replaced by the next scheme up the ladder, so gain and risk
# escalate as you go. When the ladder runs out, the empty slots stay empty.
#
# cash is a range (inclusive). susp is added when you run it. audit_chance is the percent chance
# that `audit` (an incident id, default sys_audit_scare) lands in your queue.
# A scheme may hit a jackpot: jackpot_chance percent of runs multiply the cash by a roll in
# jackpot_mult (inclusive) and add jackpot_susp on top of susp. Big money gets noticed.

# ---------- tier 1: petty ----------
[[scheme]]
id = "creative_expenses"
tier = 1
name = "Creative expenses"
desc = "Reclassify the pub as 'team infrastructure review'."
minutes = 60
cash = [250, 700]
susp = 3
audit_chance = 5
story = "expensed a pub crawl as a 'distributed systems offsite'"
story_value = 1
jackpot_chance = 6
jackpot_mult = [4, 8]
jackpot_susp = 3
jackpot_line = "Accounts approved the 'offsite' as an annual programme, backdated."


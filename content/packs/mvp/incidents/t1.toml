[[incident]]
id = "ceo_attach_file_0"
title = "CAN'T ATTACH A FILE"
tier = 1
who = "arthur"
quote = "Morning! Quick one. I need to send a document to the board and the email won't let me put it IN the email. Can you pop over and do the thing? I'm in a meeting. I'm always in a meeting."
details = "Sent from my phone. Ticket opened by his assistant's assistant."
cause = "Arthur had spent an hour looking for the attach button, which was the paperclip he kept calling 'the staple'."
chain = "ceo_attach_file"
step = 0

  [[incident.option]]
  id = "walk"
  text = "Walk him through the paperclip icon"
  kind = "professional"
  minutes = 60
  result = "It takes forty minutes. He thanks you for 'fixing the cloud' and asks if the staple will be billed."
  effects = [ { fucks = -3 } ]

  [[incident.option]]
  id = "paste"
  text = "Help him paste all 80 pages into the email body"
  kind = "malicious"
  result = "The board receives one email, eighty pages long. Three reply 'received'. One asks for a summary."
  story = "made the CEO email the board eighty pages inline"
  story_value = 2
  effects = [ { fucks = 5 }, { susp = 3 }, { np = 1 } ]

  [[incident.option]]
  id = "weather"
  text = "Blame the cloud, it's raining"
  kind = "dodge"
  minutes = 20
  result = "'Ah, weather.' He wanders off, satisfied. It will be back, and it will be wetter."
  effects = [ { fucks = -1 } ]


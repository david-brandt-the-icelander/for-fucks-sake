# System incidents: never drawn randomly, only reached via spawn.

[[incident]]
id = "sys_audit_scare"
title = "INTERNAL AUDIT SCARE"
tier = 2
who = "margaret"
system = true
quote = "An anomaly has appeared on the ledger. A small one. A thing that should not be. I shall look at it, then at you, then at the logs. Do you know what a 'material variance' is? I'll wait. I'll count while I wait."
cause = "Margaret had spotted a small ledger anomaly and begun an internal audit that made every expense report twitch."

  [[incident.option]]
  id = "cooperate"
  text = "Co-operate fully; sit, smile, sweat, show receipts"
  kind = "professional"
  minutes = 90
  result = "You produce every receipt, in order. She writes 'adequate'. It is the nicest word she owns."
  effects = [ { fucks = -6 }, { susp = -6 } ]

  [[incident.option]]
  id = "logs"
  text = "Hand over every log since 2011, printed"
  kind = "malicious"
  result = "Margaret receives forty thousand pages, says 'thank you' and starts counting. She'll be there until spring."
  story = "buried the CFO in her own audit logs"
  story_value = 2
  effects = [ { fucks = 5 }, { susp = -2 }, { np = 2 } ]

  [[incident.option]]
  id = "pip"
  text = "Mention it was probably Pip's"
  kind = "dodge"
  minutes = 20
  result = "She writes 'Pip' in the margin and circles it. Pip is, regrettably, innocent and unemployable."
  effects = [ { fucks = -2 }, { susp = -3 }, { chance = 30, then = [ { susp = 8 } ] } ]

  [[incident.option]]
  id = "anomaly"
  text = "Say anomalies are what she's made of"
  kind = "vent"
  temptation = true
  minutes = 20
  result = "She writes 'anomaly: you' in the margin. She does not look up. The audit becomes personal."
  effects = [ { fucks = 8 }, { susp = 8 } ]

